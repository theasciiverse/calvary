[package]
name = "calvary"
version = "0.1.0"
edition = "2021"
description = "Asciiverse action-RTS built from Crack dot Com's public-domain Golgotha (1998), Rust + Ratatui"

[[bin]]
name = "calvary"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav"] }
gilrs = { version = "0.11", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
